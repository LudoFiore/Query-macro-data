name: Aggiorna dati macro

on:
  schedule:
    - cron: '0 6 2 * *'      # il 2 di ogni mese, 06:00 UTC
  workflow_dispatch:          # e a mano, dal tasto "Run workflow"

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dipendenze
        run: pip install requests pandas openpyxl "xlrd==2.0.1"

      - name: Prelievo
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/fetch.py

      - name: Commit
        run: |
          git config user.name  "ponte-dati"
          git config user.email "actions@github.com"
          git add data/
          git diff --staged --quiet || git commit -m "dati aggiornati $(date -u +%Y-%m-%d)"
          git push
